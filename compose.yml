services:
  web:
    build:
      context: .
      target: development
    depends_on:
      - redis
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379/1
    volumes:
      - .:/rails
      - mecab_api_storage:/rails/storage
    stdin_open: true
    tty: true
    command: >
      bash -c "
        rm -f tmp/pids/server.pid &&
        bundle exec rdbg --open --host 0.0.0.0 --nonstop -n -- bin/rails s -p 3000 -b '0.0.0.0'
      "
  redis:
    image: "redis:7-alpine"
    ports:
      - "6379:6379"

volumes:
  mecab_api_storage:
